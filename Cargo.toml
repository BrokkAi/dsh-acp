[package]
name = "dsh-acp"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
description = "A full-featured DeepSeek ACP agent harness"
license = "MIT"
repository = "https://github.com/BrokkAi/dsh-acp"
homepage = "https://github.com/BrokkAi/dsh-acp#readme"
readme = "README.md"
keywords = ["acp", "deepseek", "ai-agent", "coding-agent", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
agent-client-protocol = { version = "3.4.0", features = ["schemars", "stdio", "unstable", "unstable_protocol_v2"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true


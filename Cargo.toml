[package]
name = "dsh-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A full-featured DeepSeek ACP agent harness"
license = "MIT"

[dependencies]
agent-client-protocol = { version = "3.4.0", features = ["schemars", "stdio", "unstable", "unstable_protocol_v2"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Keep schema derives on the MSRV-compatible patch release.
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

